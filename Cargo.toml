[workspace]
members = [
    "crates/greeners",
    "crates/greeners-core",
    "crates/greeners-ols",
    "crates/greeners-glm",
    "crates/greeners-panel",
    "crates/greeners-timeseries",
    "crates/greeners-ml",
    "crates/greeners-bayesian",
    "crates/greeners-causal",
    "crates/greeners-spatial",
    "crates/greeners-survival",
    "crates/greeners-imputation",
    "crates/greeners-diagnostics",
]
resolver = "2"

[workspace.package]
version = "2.0.1"
description = "High-performance econometrics with R/Python formulas"
rust-version = "1.84.0"
edition = "2021"
authors = ["Flávio de Vasconcellos Corrêa <contact@greeners.io>"]
license = "MIT"
repository = "https://github.com/sheep-farm/Greeners"

[workspace.dependencies]
ndarray = "0.17.1"
faer = "0.22"
thiserror = "1"
statrs = "0.18.0"
csv = "1.3"
regex = "1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
num-complex = "0.4.6"
chrono = { version = "0.4", features = ["serde"] }
argmin = "0.10.0"
argmin-math = { version = "0.4", default-features = false, features = ["primitives", "vec"] }
indexmap = { version = "2", features = ["serde"] }
rayon = "1.10"
criterion = { version = "0.5", features = ["html_reports"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
