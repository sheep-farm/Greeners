[package]
name = "greeners"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
ndarray = { workspace = true }
faer = { workspace = true }
thiserror = { workspace = true }
statrs = { workspace = true }
csv = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
num-complex = { workspace = true }
chrono = { workspace = true }
argmin = { workspace = true }
argmin-math = { workspace = true }
indexmap = { workspace = true }
rayon = { workspace = true }
greeners-core = { path = "../greeners-core" }
greeners-ols = { path = "../greeners-ols" }
greeners-glm = { path = "../greeners-glm" }
greeners-panel = { path = "../greeners-panel" }
greeners-timeseries = { path = "../greeners-timeseries" }
greeners-ml = { path = "../greeners-ml" }
greeners-bayesian = { path = "../greeners-bayesian" }
greeners-causal = { path = "../greeners-causal" }
greeners-diagnostics = { path = "../greeners-diagnostics" }
greeners-imputation = { path = "../greeners-imputation" }
greeners-spatial = { path = "../greeners-spatial" }
greeners-survival = { path = "../greeners-survival" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }

[features]
url = ["dep:reqwest", "greeners-core/url"]

[dev-dependencies]
criterion = { workspace = true }
[[example]]
name = "dataframe_loading"
required-features = ["url"]
