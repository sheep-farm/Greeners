name: CI

on:
  push:
    branches: [main, develop, "2.0-proposal/*"]
  pull_request:
    branches: [main, develop, "2.0-proposal/*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked -- -D warnings

      - name: Check facade is up to date
        run: python3 scripts/check_facade.py

      - name: Build documentation
        run: cargo doc

      - name: Run tests
        run: cargo test --locked

      - name: Dependency / license / advisory audit
        run: cargo deny check

      - name: Release build sanity check
        run: cargo build --release --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check the declared rust-version still builds
        run: cargo check --workspace --locked
